{% load static %}
<!-- Modal -->
<div class="modal fade " id="category-form" tabindex="-1" aria-labelledby="form" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="category-form">Create Category</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    <form action="{% url 'add_category' %}" method="post">
      <div class="modal-body">
        {% csrf_token %}
        {{ category_form.name }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary" href="#">Create</button>
      </div>
    </form>
    </div>
  </div>
</div>
