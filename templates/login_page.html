{% include "base.html" %}

{% block head %}
    <style>
        body {
            background-image: url("https://images.unsplash.com/photo-1530292178889-67a8dc571e85?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .content {
            z-index: 1;
        }
    </style>

{% endblock %}


{% block content %}
    <section id="user-login-page">
        <div class="overlay"></div>
        <div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 100vh;">
            {% load socialaccount %}
            <form action="{% provider_login_url 'google' %}" method="post" class="content d-flex justify-content-center align-items-center w-50">
                {% csrf_token %}
                <button type="submit" class="btn btn-lg btn-light w-50 btn-outline-primary text-black"><i class="bi bi-google me-2 text-dark"></i>Login with Google</button>
            </form>
        </div>
    </section>
{% endblock %}
